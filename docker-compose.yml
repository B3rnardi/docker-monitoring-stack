services:
  app:
    build: ./app
    ports:
        - "8000:8000"

  redis:
    image: redis:alpine
    volumes:
      - "redis_data:/data"
    ports:
        - "6379:6379"
  
  prometheus:
    image: prom/prometheus
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "prometheus_data:/prometheus"
    ports:
      - "9090:9090"
  
  grafana:
    image: grafana/grafana
    volumes:
      - "grafana_data:/var/lib/grafana"
    ports:
        - "3000:3000"
volumes:
  redis_data:
  prometheus_data:
  grafana_data: